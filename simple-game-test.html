<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { text-align: center; color: #333; }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        .test-section h2 { color: #667eea; margin-top: 0; }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏修复和测试工具</h1>

        <div class="test-section">
            <h2>第一步：强制清除缓存</h2>
            <p>很多游戏问题是由localStorage缓存导致的。请先清除缓存。</p>
            <button onclick="forceClearCache()">⚠️ 清除所有缓存</button>
            <div id="cacheStatus" class="status"></div>
        </div>

        <div class="test-section">
            <h2>第二步：测试各个游戏</h2>
            <p>请逐个点击下面的游戏进行测试，并告诉我哪些能正常运行：</p>

            <div class="button-group">
                <button onclick="testGame('snake-game')">🐍 贪吃蛇</button>
                <button onclick="testGame('2048')">🔢 2048</button>
                <button onclick="testGame('tetris')">🟦 俄罗斯方块</button>
                <button onclick="testGame('breakout')">🧱 打砖块</button>
                <button onclick="testGame('runner-game')">🏃 跑酷</button>
                <button onclick="testGame('tank-battle')">🎮 坦克</button>
                <button onclick="testGame('tower-defense')">🏰 塔防</button>
                <button onclick="testGame('memory')">🃏 记忆</button>
                <button onclick="testGame('pong-game')">🏓 弹球</button>
            </div>

            <div id="testStatus" class="status"></div>
        </div>

        <div class="test-section">
            <h2>第三步：返回主页</h2>
            <button onclick="goHome()">🏠 返回主页</button>
        </div>

        <div class="test-section">
            <h2>常见问题解决方案</h2>
            <ul>
                <li><strong>游戏无响应：</strong>点击"清除所有缓存"按钮</li>
                <li><strong>按钮无响应：</strong>清除缓存后刷新页面</li>
                <li><strong>游戏空白：</strong>按F12打开开发者工具查看错误</li>
            </ul>
        </div>
    </div>

    <script>
        function forceClearCache() {
            const statusDiv = document.getElementById('cacheStatus');

            try {
                // 清除所有localStorage数据
                localStorage.clear();

                statusDiv.className = 'status success';
                statusDiv.style.display = 'block';
                statusDiv.innerHTML = '✅ 已清除所有缓存！<br>现在请重新加载页面并测试游戏。';

                // 3秒后自动刷新页面
                setTimeout(() => {
                    location.reload();
                }, 3000);

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                statusDiv.innerHTML = '❌ 清除失败：' + error.message;
            }
        }

        function testGame(gamePath) {
            // 在新窗口中打开游戏
            window.open(gamePath + '/index.html', '_blank', 'width=800,height=600');

            const statusDiv = document.getElementById('testStatus');
            statusDiv.className = 'status success';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '✅ 已在新窗口中打开 ' + gamePath + '<br>请测试游戏是否能正常运行。';
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // 页面加载时检查缓存状态
        window.addEventListener('DOMContentLoaded', () => {
            const keys = Object.keys(localStorage);
            if (keys.length > 0) {
                document.getElementById('cacheStatus').className = 'status error';
                document.getElementById('cacheStatus').style.display = 'block';
                document.getElementById('cacheStatus').innerHTML = '⚠️ 检测到缓存数据，建议先清除！';
            }
        });
    </script>
</body>
</html>
