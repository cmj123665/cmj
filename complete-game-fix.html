<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>游戏问题诊断和修复</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        h1 { text-align: center; }
        .game-test {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        .game-test h3 { margin-top: 0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            padding: 15px 30px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏问题诊断和修复</h1>

        <div class="game-test">
            <h3>第一步：清除所有缓存</h3>
            <p>很多问题是由localStorage中的损坏数据导致的。</p>
            <button onclick="clearAllCache()">🗑️ 清除所有缓存</button>
            <div id="cacheStatus"></div>
        </div>

        <div class="game-test">
            <h3>第二步：测试每个游戏</h3>
            <p>点击下面的链接测试每个游戏，然后报告哪些能正常运行：</p>

            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px;">
                <div style="text-align: center;">
                    <strong>🐍 贪吃蛇</strong><br>
                    <a href="snake-game/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
                <div style="text-align: center;">
                    <strong>🔢 2048</strong><br>
                    <a href="2048/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
                <div style="text-align: center;">
                    <strong>🟦 俄罗斯方块</strong><br>
                    <a href="tetris/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
                <div style="text-align: center;">
                    <strong>🧱 打砖块</strong><br>
                    <a href="breakout/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
                <div style="text-align: center;">
                    <strong>🏃 跑酷</strong><br>
                    <a href="runner-game/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
                <div style="text-align: center;">
                    <strong>🎮 坦克</strong><br>
                    <a href="tank-battle/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
                <div style="text-align: center;">
                    <strong>🏰 塔防</strong><br>
                    <a href="tower-defense/index.html" target="_blank" style="color: #007bff;">测试游戏</a>
                </div>
            </div>
        </div>

        <div class="game-test">
            <h3>第三步：返回主页</h3>
            <button onclick="goHome()">🏠 返回主页</button>
        </div>
    </div>

    <script>
        function clearAllCache() {
            const statusDiv = document.getElementById('cacheStatus');

            try {
                // 保存基本用户数据
                const userData = localStorage.getItem('userData');
                const playerData = localStorage.getItem('playerData');

                // 清除所有数据
                localStorage.clear();

                // 恢复基本数据
                if (userData) localStorage.setItem('userData', userData);
                if (playerData) localStorage.setItem('playerData', playerData);

                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✅ 已清除所有缓存！<br>现在游戏应该能正常运行了。';
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '❌ 清除失败：' + error.message;
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
