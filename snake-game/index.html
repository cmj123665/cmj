<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <script src="../js/game-effects.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal.show { display: flex; }
        .start-screen {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            color: #475569;
            max-width: 320px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .start-screen h2 {
            font-size: 2rem; margin-bottom: 15px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .start-screen p { margin: 8px 0; color: #94a3b8; }
        .modal-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none; border-radius: 14px;
            color: white; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(96, 165, 250, 0.3);
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #fefce8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .game-container {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 10px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 0 20px;
            width: 100%; max-width: 600px;
        }
        .header h1 {
            color: #22c55e;
            font-size: 1.8rem;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }
        .score-board {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 12px;
            color: #475569;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .score-board span {
            color: #f59e0b;
            font-weight: bold; font-size: 1.3rem;
        }
        #gameCanvas {
            border: 2px solid rgba(34, 197, 94, 0.2);
            border-radius: 20px;
            background: linear-gradient(180deg, #dcfce7 0%, #ecfdf5 100%);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.1);
        }
        .game-over {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px;
            text-align: center; color: #475569;
            display: none;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            z-index: 100;
        }
        .game-over.show { display: block; }
        .game-over h2 {
            font-size: 2rem; margin-bottom: 16px;
            color: #ef4444;
        }
        .btn {
            padding: 10px 20px;
            background: linear-gradient(145deg, #60a5fa 0%, #a78bfa 100%);
            color: white; border: none; border-radius: 12px;
            cursor: pointer; font-size: 1rem; margin: 0 5px;
            box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
        }
        .level-bar { width: 100%; max-width: 600px; margin: 8px auto 0; background: rgba(255,255,255,0.6); border-radius: 10px; padding: 8px 14px; border: 1px solid rgba(34,197,94,0.15); }
        .level-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
        .level-track { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .level-fill { height: 100%; background: linear-gradient(135deg, #4ade80, #22c55e); border-radius: 3px; transition: width 0.3s; }
        .level-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .level-card { padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.6); border: 1px solid rgba(203,213,225,0.5); cursor: pointer; transition: all 0.2s; text-align: center; }
        .level-card:hover { transform: translateY(-2px); border-color: #22c55e; }
        .level-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
        .level-card.current { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .level-card-num { font-size: 20px; font-weight: bold; color: #22c55e; }
        .level-card-target { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        .game-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex; justify-content: center; gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.5);
            z-index: 9999 !important;
        }
        .game-nav-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 20px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .game-nav-btn.primary {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            color: white;
            box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
        }
        .game-nav-btn.secondary {
            background: rgba(255,255,255,0.6);
            color: #475569;
            border: 1px solid rgba(203, 213, 225, 0.5);
        }

        .d-pad {
            position: fixed; bottom: 80px; right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px; z-index: 999;
        }
        .d-btn {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(203, 213, 225, 0.5);
            border-radius: 12px;
            color: #475569; font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
            transition: all 0.15s;
        }
        .d-btn:active {
            background: rgba(255,255,255,0.9);
            transform: scale(0.95);
        }
        @media (min-width: 768px) {
            .d-pad { display: none; }
        }
    </style>
</head>
<body>
    <div class="modal show" id="startModal">
        <div class="start-screen">
            <h2>贪吃蛇</h2>
            <p>使用方向键或WASD控制</p>
            <p>吃掉苹果得分，不要撞墙!</p>
            <button class="modal-btn" onclick="startGameReal()">开始游戏</button>
        </div>
    </div>
    <div class="game-container">
        <div class="header">
            <h1>贪吃蛇</h1>
            <div class="score-board">得分: <span id="score">0</span> | 速度: <span id="level">1</span></div>
            <div>
                <button class="btn" onclick="backToHall()">🏠 返回主页</button>
                <button class="btn" onclick="restartGame()">🔄 重新开始</button>
            </div>
        </div>
        <div class="level-bar">
            <div class="level-info"><span id="levelName">第 1 关</span><span id="levelProgress">苹果 0 / 5</span></div>
            <div class="level-track"><div class="level-fill" id="levelFill" style="width:0%"></div></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="game-over" id="gameOver">
            <h2 id="gameOverTitle">游戏结束!</h2>
            <p id="gameOverMsg">你的得分: <span id="finalScore" style="color: #f59e0b; font-weight: bold;">0</span></p>
            <div id="gameOverButtons"><button class="btn" onclick="restartGame()">再来一局</button></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let level = 1;
        let gameLoop;
        let baseGameSpeed = 150;
        let time = 0;
        let flowers = [];
        let applesEaten = 0;
        const particleSystem = new ParticleSystem(100);

        const LEVELS = [
            { id: 1, name: '青青草原', targetApples: 5 },
            { id: 2, name: '花丛小径', targetApples: 8 },
            { id: 3, name: '溪流边缘', targetApples: 12 },
            { id: 4, name: '森林深处', targetApples: 15 },
            { id: 5, name: '幽暗沼泽', targetApples: 20 },
            { id: 6, name: '荆棘之路', targetApples: 25 },
            { id: 7, name: '迷雾山谷', targetApples: 30 },
            { id: 8, name: '毒蛇巢穴', targetApples: 40 },
            { id: 9, name: '巨龙领地', targetApples: 50 },
            { id: 10, name: '蛇神试炼', targetApples: 60 }
        ];
        let currentLevel = 1;

        function getGameData() {
            const defaults = { maxLevel: 1 };
            try { const raw = localStorage.getItem('snakeGameData'); if (raw) return { ...defaults, ...JSON.parse(raw) }; } catch(e) {}
            return defaults;
        }
        function saveGameData(data) { localStorage.setItem('snakeGameData', JSON.stringify(data)); }
        function getLevelConfig() { return LEVELS[Math.min(currentLevel, LEVELS.length) - 1] || LEVELS[0]; }
        function updateLevelUI() {
            const cfg = getLevelConfig();
            document.getElementById('levelName').textContent = `第 ${currentLevel} 关 · ${cfg.name}`;
            document.getElementById('levelProgress').textContent = `苹果 ${applesEaten} / ${cfg.targetApples}`;
            const pct = Math.min(100, Math.floor((applesEaten / cfg.targetApples) * 100));
            document.getElementById('levelFill').style.width = pct + '%';
        }

        function getGameSpeed(lvl) {
            const speed = Math.max(60, 150 - (lvl - 1) * 15);
            return speed;
        }

        function updateLevel() {
            const newLevel = Math.floor(score / 50) + 1;
            if (newLevel !== level) {
                level = newLevel;
                document.getElementById('level').textContent = level;
                startGameLoop();
            }
        }

        function initGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            dx = 0; dy = 0;
            score = 0;
            level = 1;
            applesEaten = 0;
            time = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('gameOver').classList.remove('show');
            flowers = [];
            for (let i = 0; i < 15; i++) {
                flowers.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    color: ['#fca5a5', '#fde68a', '#c4b5fd', '#bae6fd'][Math.floor(Math.random() * 4)],
                    size: 3 + Math.random() * 4
                });
            }
            particleSystem.clear();
            updateLevelUI();
            draw();
            startGameLoop();
        }

        function draw() {
            // 草地背景
            const grassGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grassGrad.addColorStop(0, '#dcfce7');
            grassGrad.addColorStop(1, '#ecfdf5');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 花朵装饰
            flowers.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 淡网格
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.06)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 苹果食物
            const fx = food.x * gridSize + gridSize / 2;
            const fy = food.y * gridSize + gridSize / 2;
            drawApple(ctx, fx, fy, 8, time * 3);

            // 真正的蛇
            const direction = {dx: dx || 0, dy: dy || -1};
            drawSnake(ctx, snake, gridSize, '#4ade80', direction);

            // 粒子效果
            particleSystem.draw(ctx);
        }

        function startGameLoop() {
            clearInterval(gameLoop);
            gameLoop = setInterval(update, getGameSpeed(level));
        }

        function update() {
            time += 0.05;
            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                applesEaten++;
                document.getElementById('score').textContent = score;
                updateLevel();
                updateLevelUI();
                const cfg = getLevelConfig();
                if (applesEaten >= cfg.targetApples) {
                    levelComplete();
                    return;
                }
                const fx = food.x * gridSize + gridSize / 2;
                const fy = food.y * gridSize + gridSize / 2;
                particleSystem.emit(fx, fy, 15, {
                    colors: ['#fbbf24', '#f59e0b', '#fcd34d', '#fca5a5'],
                    speed: 2, size: 3, life: 20
                });
                generateFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function generateFood() {
            do {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            } while (snake.some(part => part.x === food.x && part.y === food.y));
        }

        function levelComplete() {
            clearInterval(gameLoop);
            const cfg = getLevelConfig();
            const data = getGameData();
            const levelBonus = currentLevel * 50;
            if (currentLevel >= data.maxLevel && currentLevel < LEVELS.length) data.maxLevel = currentLevel + 1;
            saveGameData(data);
            document.getElementById('gameOverTitle').textContent = '🎉 关卡完成!';
            document.getElementById('gameOverTitle').style.color = '#22c55e';
            document.getElementById('gameOverMsg').innerHTML = `完成 ${cfg.name} · 得分 <span style="color: #f59e0b; font-weight: bold;">${score + levelBonus}</span>`;
            const btns = document.getElementById('gameOverButtons');
            if (currentLevel < LEVELS.length) {
                btns.innerHTML = `<button class="btn" onclick="nextLevel()">下一关</button><button class="btn" onclick="restartGame()">重玩本关</button>`;
            } else {
                btns.innerHTML = `<button class="btn" onclick="restartGame()">再次挑战</button>`;
            }
            document.getElementById('gameOver').classList.add('show');
        }
        function gameOver() {
            clearInterval(gameLoop);
            document.getElementById('gameOverTitle').textContent = '游戏结束!';
            document.getElementById('gameOverTitle').style.color = '#ef4444';
            document.getElementById('gameOverMsg').innerHTML = `你的得分: <span style="color: #f59e0b; font-weight: bold;">${score}</span>`;
            document.getElementById('gameOverButtons').innerHTML = `<button class="btn" onclick="restartGame()">再来一局</button>`;
            document.getElementById('gameOver').classList.add('show');
            snake.forEach(part => {
                const x = part.x * gridSize + gridSize / 2;
                const y = part.y * gridSize + gridSize / 2;
                particleSystem.emit(x, y, 6, {
                    colors: ['#4ade80', '#22c55e', '#ffffff'],
                    speed: 2, size: 2.5, life: 25
                });
            });
        }
        function nextLevel() {
            if (currentLevel < LEVELS.length) currentLevel++;
            restartGame();
        }

        function changeDirection(e) {
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !goingDown) {
                dx = 0; dy = -1;
            }
            if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && !goingUp) {
                dx = 0; dy = 1;
            }
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && !goingRight) {
                dx = -1; dy = 0;
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && !goingLeft) {
                dx = 1; dy = 0;
            }
        }

        function restartGame() {
            initGame();
        }

        function backToHall() {
            window.location.href = '../index.html';
        }

        document.addEventListener('keydown', changeDirection);

        function moveDirection(dir) {
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (dir === 'up' && !goingDown) { dx = 0; dy = -1; }
            if (dir === 'down' && !goingUp) { dx = 0; dy = 1; }
            if (dir === 'left' && !goingRight) { dx = -1; dy = 0; }
            if (dir === 'right' && !goingLeft) { dx = 1; dy = 0; }
        }

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                moveDirection(diffX > 0 ? 'right' : 'left');
            } else {
                moveDirection(diffY > 0 ? 'down' : 'up');
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        sessionStorage.setItem('gameStartTime', Date.now());
        sessionStorage.setItem('currentGame', 'snake-game');

        function startGameReal() {
            document.getElementById('startModal').classList.remove('show');
            initGame();
        }
    </script>

    <div class="d-pad">
        <div></div>
        <button class="d-btn" ontouchstart="moveDirection('up')" onclick="moveDirection('up')">↑</button>
        <div></div>
        <button class="d-btn" ontouchstart="moveDirection('left')" onclick="moveDirection('left')">←</button>
        <div></div>
        <button class="d-btn" ontouchstart="moveDirection('right')" onclick="moveDirection('right')">→</button>
        <div></div>
        <button class="d-btn" ontouchstart="moveDirection('down')" onclick="moveDirection('down')">↓</button>
        <div></div>
    </div>

    <div class="modal" id="levelModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:200;">
        <div class="start-screen" style="max-width:360px;width:90%;">
            <h2>🗺️ 关卡选择</h2>
            <div class="level-select-grid" id="levelGrid"></div>
            <button class="modal-btn" onclick="document.getElementById('levelModal').style.display='none'" style="margin-top:10px;">关闭</button>
        </div>
    </div>
    <div class="game-nav">
        <button class="game-nav-btn primary" onclick="backToHall()">
            <span>🏠</span><span>返回大厅</span>
        </button>
        <button class="game-nav-btn secondary" onclick="document.getElementById('levelModal').style.display='flex'; renderLevelSelect();">
            <span>🗺️</span><span>关卡</span>
        </button>
        <button class="game-nav-btn secondary" onclick="restartGame()">
            <span>🔄</span><span>重新开始</span>
        </button>
        <button class="game-nav-btn secondary" onclick="document.getElementById('helpModal').classList.add('show')">
            <span>❓</span><span>游戏说明</span>
        </button>
    </div>
    <script>
        function renderLevelSelect() {
            const data = getGameData();
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            LEVELS.forEach(lv => {
                const unlocked = lv.id <= data.maxLevel;
                const isCurrent = lv.id === currentLevel;
                const card = document.createElement('div');
                card.className = 'level-card' + (isCurrent ? ' current' : '') + (!unlocked ? ' locked' : '');
                card.innerHTML = `<div class="level-card-num">${lv.id}</div><div class="level-card-target">${lv.name}</div><div class="level-card-target">${lv.targetApples} 苹果</div>`;
                if (unlocked) card.onclick = () => { currentLevel = lv.id; document.getElementById('levelModal').style.display = 'none'; restartGame(); };
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
