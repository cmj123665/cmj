<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐏 羊了个羊 - 消除游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部信息 -->
        <div class="game-header">
            <h1>🐏 消消大作战</h1>
            <div class="game-info">
                <div class="level-display">关卡: <span id="level">1</span></div>
                <div class="score-display">得分: <span id="score">0</span></div>
                <button id="restart-btn" class="btn-small">🔄</button>
            </div>
        </div>

        <!-- 道具栏 -->
        <div class="tools-bar">
            <button id="tool-remove" class="tool-btn" title="移出三张">
                <span class="tool-icon">📤</span>
                <span class="tool-count" id="remove-count">3</span>
            </button>
            <button id="tool-undo" class="tool-btn" title="撤回">
                <span class="tool-icon">↩️</span>
                <span class="tool-count" id="undo-count">3</span>
            </button>
            <button id="tool-shuffle" class="tool-btn" title="洗牌">
                <span class="tool-icon">🔀</span>
                <span class="tool-count" id="shuffle-count">3</span>
            </button>
            <button id="tool-clear" class="tool-btn" title="超级清除">
                <span class="tool-icon">✨</span>
                <span class="tool-count" id="clear-count">1</span>
            </button>
        </div>

        <!-- 游戏区域 -->
        <div class="game-area">
            <!-- 方块堆叠区域 -->
            <div id="board" class="board"></div>
        </div>

        <!-- 底部卡槽 -->
        <div class="slot-container">
            <div class="slot-label">卡槽</div>
            <div id="slot" class="slot"></div>
        </div>

        <!-- 游戏结束/胜利弹窗 -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title"></h2>
                <p id="modal-message"></p>
                <div class="modal-buttons">
                    <button id="modal-revive" class="btn revive-btn hidden">💖 复活继续</button>
                    <button id="modal-btn" class="btn">下一关</button>
                </div>
            </div>
        </div>

        <!-- 道具效果动画层 -->
        <div id="effects-layer" class="effects-layer"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
