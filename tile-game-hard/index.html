<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐏 羊了个羊 - 消除游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部信息 -->
        <div class="game-header">
            <h1>🐏 消消大作战</h1>
            <div class="game-info">
                <div class="level-display">关卡: <span id="level">1</span></div>
                <div class="score-display">得分: <span id="score">0</span></div>
                <button id="restart-btn" class="btn-small">🔄</button>
            </div>
        </div>

        <!-- 道具栏 -->
        <div class="tools-bar">
            <button id="tool-remove" class="tool-btn" title="移出三张">
                <span class="tool-icon">📤</span>
                <span class="tool-count" id="remove-count">3</span>
            </button>
            <button id="tool-undo" class="tool-btn" title="撤回">
                <span class="tool-icon">↩️</span>
                <span class="tool-count" id="undo-count">3</span>
            </button>
            <button id="tool-shuffle" class="tool-btn" title="洗牌">
                <span class="tool-icon">🔀</span>
                <span class="tool-count" id="shuffle-count">3</span>
            </button>
            <button id="tool-clear" class="tool-btn" title="超级清除">
                <span class="tool-icon">✨</span>
                <span class="tool-count" id="clear-count">1</span>
            </button>
        </div>

        <!-- 游戏区域 -->
        <div class="game-area">
            <!-- 方块堆叠区域 -->
            <div id="board" class="board"></div>
        </div>

        <!-- 底部卡槽 -->
        <div class="slot-container">
            <div class="slot-label">卡槽</div>
            <div id="slot" class="slot"></div>
        </div>

        <!-- 游戏结束/胜利弹窗 -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title"></h2>
                <p id="modal-message"></p>
                <div class="modal-buttons">
                    <button id="modal-revive" class="btn revive-btn hidden">💖 复活继续</button>
                    <button id="modal-btn" class="btn">下一关</button>
                </div>
            </div>
        </div>

        <!-- 道具效果动画层 -->
        <div id="effects-layer" class="effects-layer"></div>
    </div>

    <script src="game.js"></script>
    <div class="game-nav">
        <button class="game-nav-btn primary" onclick="backToHall()">
            <span>🏠</span><span>返回大厅</span>
        </button>
        <button class="game-nav-btn secondary" onclick="openHardLevelSelect()">
            <span>🗺️</span><span>关卡</span>
        </button>
        <button class="game-nav-btn secondary" onclick="location.reload()">
            <span>🔄</span><span>重新开始</span>
        </button>
        <button class="game-nav-btn tertiary" onclick="document.getElementById('helpModal').classList.add('show')">
            <span>❓</span><span>游戏说明</span>
        </button>
    </div>
    <div class="modal" id="levelModal">
        <div class="modal-content" style="max-width:360px;max-height:80vh;overflow:auto;">
            <h2>🗺️ 关卡选择</h2>
            <div id="levelGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0;"></div>
            <button class="btn" onclick="document.getElementById('levelModal').classList.remove('show')">关闭</button>
        </div>
    </div>
    <div class="modal" id="helpModal">
        <div class="modal-content">
            <h2>游戏说明</h2>
            <p>点击方块将其移入底部卡槽</p>
            <p>3个相同图案即可消除</p>
            <p>卡槽满8个则游戏结束</p>
            <p>🐏 多种道具助你通关</p>
            <button class="btn" onclick="document.getElementById('helpModal').classList.remove('show')">知道了</button>
        </div>
    </div>
    <style>
        .game-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.95); padding: 12px 20px;
            display: flex; justify-content: center; gap: 12px;
            z-index: 9999;
        }
        .game-nav-btn {
            padding: 10px 20px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .game-nav-btn.primary { background: linear-gradient(135deg,#667eea,#764ba2); color: white; }
        .game-nav-btn.secondary { background: #f5f5f5; color: #333; }
        .game-nav-btn.tertiary { background: #e3f2fd; color: #1976d2; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 300px; }
        .modal-content h2 { margin-bottom: 15px; }
        .modal-content p { margin: 8px 0; color: #555; }
        .modal-content .btn { margin-top: 15px; padding: 10px 30px; border: none; border-radius: 8px; background: linear-gradient(135deg,#667eea,#764ba2); color: white; cursor: pointer; font-size: 16px; }
    </style>
    <script>
        function backToHall() {
            window.location.href = '../index.html';
        }
        function openHardLevelSelect() { document.getElementById('levelModal').classList.add('show'); renderHardLevelSelect(); }
        function renderHardLevelSelect() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            const maxLevel = parseInt(localStorage.getItem('tileGameHardMaxLevel')) || 1;
            for (let i = 1; i <= 30; i++) {
                const card = document.createElement('div');
                card.style.cssText = 'padding:10px;border-radius:8px;text-align:center;cursor:pointer;font-weight:bold;';
                if (i > maxLevel) {
                    card.style.background = '#e0e0e0'; card.style.color = '#999'; card.style.cursor = 'not-allowed';
                    card.innerHTML = `<div style="font-size:18px;">🔒</div><div style="font-size:11px;">第${i}关</div>`;
                } else {
                    card.style.background = i === maxLevel ? '#fff3e0' : '#e8f5e9';
                    card.style.color = '#5c4f43';
                    card.innerHTML = `<div style="font-size:20px;">${i}</div><div style="font-size:11px;">第${i}关</div>`;
                    card.onclick = () => { selectHardLevel(i); document.getElementById('levelModal').classList.remove('show'); };
                }
                grid.appendChild(card);
            }
        }
    </script>
</body>
</html>
