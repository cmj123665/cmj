<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射击</title>
    <script src="../js/game-effects.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fefce8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #475569;
        }
        .title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.2);
            letter-spacing: 2px;
        }
        #gameCanvas {
            border: 2px solid rgba(96, 165, 250, 0.2);
            border-radius: 20px;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 40%, #f0f9ff 100%);
            box-shadow: 0 8px 32px rgba(96, 165, 250, 0.15);
        }
        .info {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
        .info span {
            color: #60a5fa;
            font-weight: bold;
            font-size: 16px;
        }
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            color: #475569;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 320px; width: 90%;
        }
        .modal-content h2 {
            font-size: 1.8rem; margin-bottom: 16px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-content p { margin: 8px 0; color: #94a3b8; }
        .modal-btn {
            padding: 14px 36px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none; border-radius: 14px;
            color: white; font-size: 1rem; font-weight: bold;
            cursor: pointer; margin: 8px 5px;
            box-shadow: 0 4px 15px rgba(96, 165, 250, 0.3);
            transition: all 0.2s;
        }
        .modal-btn:hover { transform: scale(1.05); }
        .level-bar { margin-top: 8px; width: 320px; background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(96,165,250,0.2); }
        .level-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
        .level-track { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .level-fill { height: 100%; background: linear-gradient(135deg, #60a5fa, #a78bfa); border-radius: 3px; transition: width 0.3s; }
        .level-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .level-card { padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.6); border: 1px solid rgba(203,213,225,0.5); cursor: pointer; transition: all 0.2s; text-align: center; }
        .level-card:hover { transform: translateY(-2px); border-color: #a78bfa; }
        .level-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
        .level-card.current { border-color: #60a5fa; background: rgba(96,165,250,0.1); }
        .level-card-num { font-size: 20px; font-weight: bold; color: #60a5fa; }
        .level-card-target { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .game-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex; justify-content: center; gap: 12px;
            z-index: 9999 !important;
            border-top: 1px solid rgba(255,255,255,0.5);
        }
        .game-nav-btn {
            padding: 10px 20px; border: none; border-radius: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .game-nav-btn.primary {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            color: white;
            box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
        }
        .game-nav-btn.secondary {
            background: rgba(255,255,255,0.6);
            color: #475569;
            border: 1px solid rgba(203, 213, 225, 0.5);
        }
    </style>
</head>
<body>
    <div class="title">太空射击</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info">
        <p>分数: <span id="score">0</span> &nbsp;&nbsp; 波次: <span id="wave">1</span></p>
    </div>
    <div class="level-bar">
        <div class="level-info"><span id="levelName">第 1 关</span><span id="levelProgress">波次 1 / 3</span></div>
        <div class="level-track"><div class="level-fill" id="levelFill" style="width:0%"></div></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { x: 400, y: 500, width: 50, height: 60 };
        let bullets = [];
        let enemies = [];
        let score = 0;
        let wave = 1;
        let gameRunning = true;
        let animationFrameId = null;
        let time = 0;
        let clouds = [];
        let shootCooldown = 0;
        const SHOOT_INTERVAL = 8;

        const LEVELS = [
            { id: 1, name: '新手训练', targetWave: 3 },
            { id: 2, name: '小行星带', targetWave: 5 },
            { id: 3, name: '敌军前锋', targetWave: 7 },
            { id: 4, name: '星际遭遇', targetWave: 10 },
            { id: 5, name: '深空激战', targetWave: 13 },
            { id: 6, name: '母舰护卫', targetWave: 16 },
            { id: 7, name: '黑洞边缘', targetWave: 20 },
            { id: 8, name: '终极决战', targetWave: 25 },
            { id: 9, name: '星际霸权', targetWave: 30 },
            { id: 10, name: '宇宙霸主', targetWave: 40 }
        ];
        for (let i = 11; i <= 999; i++) {
            LEVELS.push({ id: i, name: `第${i}关`, targetWave: 40 + (i - 10) * 3 });
        }
        let currentLevel = 1;
        let levelPage = 0;
        const LEVELS_PER_PAGE = 30;

        function getGameData() {
            const defaults = { maxLevel: 1 };
            try { const raw = localStorage.getItem('spaceShooterData'); if (raw) return { ...defaults, ...JSON.parse(raw) }; } catch(e) {}
            return defaults;
        }
        function saveGameData(data) { localStorage.setItem('spaceShooterData', JSON.stringify(data)); }

        const particleSystem = new ParticleSystem(150);
        const floatText = new FloatText();

        function getLevelConfig() { return LEVELS[Math.min(currentLevel, LEVELS.length) - 1] || LEVELS[0]; }
        function updateLevelUI() {
            const cfg = getLevelConfig();
            document.getElementById('levelName').textContent = `第 ${currentLevel} 关 · ${cfg.name}`;
            document.getElementById('levelProgress').textContent = `波次 ${wave} / ${cfg.targetWave}`;
            const pct = Math.min(100, Math.floor((wave / cfg.targetWave) * 100));
            document.getElementById('levelFill').style.width = pct + '%';
        }
        function init() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            player = { x: 400, y: 500, width: 50, height: 60 };
            bullets = [];
            enemies = [];
            score = 0;
            wave = 1;
            gameRunning = true;
            time = 0;
            clouds = [];
            for (let i = 0; i < 6; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.6,
                    w: 80 + Math.random() * 120,
                    h: 25 + Math.random() * 20,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
            particleSystem.clear();
            spawnEnemies();
            updateLevelUI();
            gameLoop();
        }

        function spawnEnemies() {
            for (let i = 0; i < 6 + wave * 2; i++) {
                enemies.push({
                    x: Math.random() * 720 + 40,
                    y: -60 - Math.random() * 300,
                    width: 45,
                    height: 50,
                    speed: 1 + wave * 0.2,
                    rotation: 0
                });
            }
        }

        function update() {
            if (!gameRunning) return;
            time += 0.016;

            if (keys.left && player.x > 20) player.x -= 5;
            if (keys.right && player.x < 730) player.x += 5;

            if (keys.space) {
                if (shootCooldown <= 0) {
                    bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 12 });
                    shootCooldown = SHOOT_INTERVAL;
                }
            }
            if (shootCooldown > 0) shootCooldown--;

            bullets.forEach(b => { b.y -= 10; });
            bullets = bullets.filter(b => b.y > 0);

            enemies.forEach(e => {
                e.y += e.speed;
                e.rotation += 0.02;
            });
            enemies = enemies.filter(e => e.y < 650);

            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (b.x < e.x + e.width && b.x + 5 > e.x &&
                        b.y < e.y + e.height && b.y + 15 > e.y) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        const pts = 10 * wave;
                        score += pts;
                        document.getElementById('score').textContent = score;
                        floatText.add(e.x + e.width/2, e.y, '+' + pts, '#fbbf24');
                        particleSystem.emit(e.x + e.width/2, e.y + e.height/2, 25, {
                            colors: ['#fbbf24', '#f87171', '#fb923c', '#fde68a'],
                            speed: 3.5, size: 4, life: 30
                        });
                    }
                });
            });

            enemies.forEach(e => {
                if (e.x < player.x + player.width && e.x + e.width > player.x &&
                    e.y < player.y + player.height && e.y + e.height > player.y) {
                    gameOver();
                }
            });

            if (enemies.length === 0) {
                wave++;
                document.getElementById('wave').textContent = wave;
                const cfg = getLevelConfig();
                updateLevelUI();
                if (wave > cfg.targetWave) {
                    levelComplete();
                    return;
                }
                spawnEnemies();
            }

            clouds.forEach(c => {
                c.y += c.speed;
                if (c.y > canvas.height + 50) {
                    c.y = -50;
                    c.x = Math.random() * canvas.width;
                }
            });

            particleSystem.update();
            floatText.update();
            draw();
        }

        const keys = { left: false, right: false, space: false };
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ') keys.space = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === ' ') keys.space = false;
        });

        function draw() {
            ctx.save();

            // 天空背景
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#bae6fd');
            skyGrad.addColorStop(0.4, '#e0f2fe');
            skyGrad.addColorStop(1, '#f0f9ff');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 云朵
            clouds.forEach(c => {
                drawCloud(ctx, c.x, c.y, c.w, c.h, 'rgba(255,255,255,0.5)');
            });

            // 玩家飞机
            drawPlane(ctx, player.x, player.y, player.width, player.height, '#60a5fa', 1);

            // 激光子弹
            bullets.forEach(b => {
                drawLaser(ctx, b.x, b.y, b.width, b.height, '#fbbf24', 10);
            });

            // 敌机
            enemies.forEach(e => {
                drawEnemyPlane(ctx, e.x, e.y, e.width, e.height, '#f87171', e.rotation);
            });

            // 爆炸粒子
            particleSystem.draw(ctx);

            // 得分飘字
            floatText.draw(ctx);

            ctx.restore();
        }

        function gameLoop() {
            update();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function levelComplete() {
            gameRunning = false;
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            const cfg = getLevelConfig();
            const data = getGameData();
            const levelBonus = currentLevel * 100;
            if (currentLevel >= data.maxLevel && currentLevel < LEVELS.length) data.maxLevel = currentLevel + 1;
            saveGameData(data);
            document.getElementById('gameOverTitle').textContent = '🎉 关卡完成!';
            document.getElementById('finalScore').textContent = score + ' + ' + levelBonus + ' 奖励';
            document.getElementById('finalWave').textContent = wave;
            const btns = document.getElementById('gameOverModal').querySelector('.modal-content');
            let btnHtml = '';
            if (currentLevel < LEVELS.length) {
                btnHtml = `<button class="modal-btn" onclick="nextLevel()">下一关</button><button class="modal-btn" onclick="document.getElementById('gameOverModal').classList.remove('show'); init();">重玩本关</button>`;
            } else {
                btnHtml = `<button class="modal-btn" onclick="document.getElementById('gameOverModal').classList.remove('show'); init();">再次挑战</button>`;
            }
            const existingBtns = btns.querySelectorAll('.modal-btn');
            existingBtns.forEach(b => b.remove());
            btns.insertAdjacentHTML('beforeend', btnHtml);
            document.getElementById('gameOverModal').classList.add('show');
            saveGameResult(score + levelBonus, wave, true);
        }
        function gameOver() {
            gameRunning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            document.getElementById('gameOverTitle').textContent = '游戏结束!';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalWave').textContent = wave;
            const btns = document.getElementById('gameOverModal').querySelector('.modal-content');
            const existingBtns = btns.querySelectorAll('.modal-btn');
            existingBtns.forEach(b => b.remove());
            btns.insertAdjacentHTML('beforeend', `<button class="modal-btn" onclick="document.getElementById('gameOverModal').classList.remove('show'); init();">再来一局</button>`);
            document.getElementById('gameOverModal').classList.add('show');
            saveGameResult(score, wave, false);
        }
        function nextLevel() {
            if (currentLevel < LEVELS.length) currentLevel++;
            document.getElementById('gameOverModal').classList.remove('show');
            init();
        }

        sessionStorage.setItem('gameStartTime', Date.now());
        sessionStorage.setItem('currentGame', 'space-shooter');
        init();
    </script>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="gameOverTitle">游戏结束!</h2>
            <p>最终分数: <span id="finalScore" style="color: #60a5fa; font-weight: bold;">0</span></p>
            <p>波次: <span id="finalWave" style="color: #a78bfa; font-weight: bold;">1</span></p>
            <button class="modal-btn" onclick="document.getElementById('gameOverModal').classList.remove('show'); init();">再来一局</button>
        </div>
    </div>
    <div class="modal" id="helpModal">
        <div class="modal-content">
            <h2>游戏说明</h2>
            <p>←→移动，空格射击</p>
            <button class="modal-btn" onclick="document.getElementById('helpModal').classList.remove('show')">知道了</button>
        </div>
    </div>
    <div class="modal" id="levelModal">
        <div class="modal-content" style="max-height:85vh;overflow-y:auto;">
            <h2>🗺️ 关卡选择</h2>
            <div class="level-select-grid" id="levelGrid"></div>
            <div id="levelPagination" style="display:flex;justify-content:center;align-items:center;gap:15px;margin:15px 0;">
                <button class="modal-btn" onclick="prevLevelPage()" style="padding:8px 16px;font-size:14px;">上一页</button>
                <span id="levelPageNum" style="font-size:14px;color:#475569;font-weight:bold;">1 / 1</span>
                <button class="modal-btn" onclick="nextLevelPage()" style="padding:8px 16px;font-size:14px;">下一页</button>
            </div>
            <button class="modal-btn" onclick="document.getElementById('levelModal').classList.remove('show')">关闭</button>
        </div>
    </div>
    <div class="game-nav">
        <button class="game-nav-btn primary" onclick="window.location.href='../index.html'">
            <span>🏠</span><span>返回大厅</span>
        </button>
        <button class="game-nav-btn secondary" onclick="openLevelSelect()">
            <span>🗺️</span><span>关卡</span>
        </button>
        <button class="game-nav-btn secondary" onclick="location.reload()">
            <span>🔄</span><span>重新开始</span>
        </button>
        <button class="game-nav-btn secondary" onclick="document.getElementById('helpModal').classList.add('show')">
            <span>❓</span><span>游戏说明</span>
        </button>
    </div>
    <script>
        function openLevelSelect() {
            levelPage = Math.floor((currentLevel - 1) / LEVELS_PER_PAGE);
            document.getElementById('levelModal').classList.add('show');
            renderLevelSelect();
        }
        function prevLevelPage() {
            if (levelPage > 0) { levelPage--; renderLevelSelect(); }
        }
        function nextLevelPage() {
            const maxPage = Math.ceil(LEVELS.length / LEVELS_PER_PAGE);
            if (levelPage < maxPage - 1) { levelPage++; renderLevelSelect(); }
        }
        function renderLevelSelect() {
            const data = getGameData();
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            const start = levelPage * LEVELS_PER_PAGE;
            const end = Math.min(start + LEVELS_PER_PAGE, LEVELS.length);
            for (let i = start; i < end; i++) {
                const lv = LEVELS[i];
                const unlocked = lv.id <= data.maxLevel;
                const isCurrent = lv.id === currentLevel;
                const card = document.createElement('div');
                card.className = 'level-card' + (isCurrent ? ' current' : '') + (!unlocked ? ' locked' : '');
                card.innerHTML = `<div class="level-card-num">${lv.id}</div><div class="level-card-target">${lv.name}</div><div class="level-card-target">目标波次 ${lv.targetWave}</div>`;
                if (unlocked) card.onclick = () => { currentLevel = lv.id; document.getElementById('levelModal').classList.remove('show'); init(); };
                grid.appendChild(card);
            }
            const maxPage = Math.ceil(LEVELS.length / LEVELS_PER_PAGE);
            document.getElementById('levelPageNum').textContent = `${levelPage + 1} / ${maxPage}`;
        }
    </script>
</body>
</html>
