<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃 跑酷冒险</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #e8f4f8 100%);
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #a8e6ff 0%, #d4f1ff 40%, #ffeef8 80%, #fff5fa 100%);
            border: 4px solid #ffb6d9;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 182, 217, 0.6);
        }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(255, 105, 180, 0.6);
            z-index: 1000;
        }

        .hud-item {
            margin-bottom: 10px;
            padding: 14px 20px;
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.95), rgba(255, 118, 158, 0.95));
            border-radius: 25px;
            border: 3px solid #fff;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.5);
        }

        .hud-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .hud-value {
            font-size: 28px;
            color: #fff;
        }

        .jump-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 15px;
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.95), rgba(255, 118, 158, 0.95));
            padding: 14px 20px;
            border-radius: 25px;
            border: 3px solid #fff;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.5);
            z-index: 1000;
        }

        .jump-dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            margin: 0 5px;
            transition: all 0.3s;
            border: 2px solid #fff;
        }

        .jump-dot.active {
            background: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
            transform: scale(1.25);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #fff9fc 0%, #ffe8f0 100%);
            padding: 70px;
            border-radius: 35px;
            text-align: center;
            color: #ff69b4;
            display: none;
            z-index: 2000;
            border: 6px solid #ffb6d9;
            box-shadow: 0 0 70px rgba(255, 182, 217, 0.7);
        }

        .game-over.show {
            display: block;
            animation: gameOverPop 0.6s ease-out;
        }

        @keyframes gameOverPop {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.08); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .game-over h2 {
            font-size: 52px;
            margin-bottom: 30px;
            color: #ff69b4;
            text-shadow: 3px 3px 8px rgba(255, 105, 180, 0.4);
        }

        .game-over p {
            font-size: 26px;
            margin: 20px 0;
            color: #ff69b4;
            font-weight: bold;
        }

        .btn {
            padding: 22px 50px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff76b8, #ff1493);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
            transition: all 0.3s;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.8);
        }

        .controls {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 1000;
        }

        .control-btn {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ffb6d9, #ff76b8);
            border: 5px solid #fff;
            border-radius: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
            transition: all 0.2s;
        }

        .control-btn:active {
            transform: scale(0.90);
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.7);
        }

        .game-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 240, 250, 0.98)) !important;
            backdrop-filter: blur(10px) !important;
            padding: 16px 22px !important;
            padding-bottom: calc(16px + env(safe-area-inset-bottom)) !important;
            display: flex !important;
            justify-content: center !important;
            gap: 16px !important;
            box-shadow: 0 -6px 30px rgba(255, 182, 217, 0.5) !important;
            z-index: 9999 !important;
            pointer-events: auto !important;
            border-top: 4px solid #ffb6d9 !important;
        }

        .game-nav-btn {
            display: flex !important;
            align-items: center !important;
            gap: 9px !important;
            padding: 15px 30px !important;
            border: 3px solid #ffb6d9 !important;
            border-radius: 25px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            transition: all 0.3s !important;
            box-shadow: 0 5px 18px rgba(255, 182, 217, 0.4) !important;
        }

        .game-nav-btn:hover {
            transform: scale(1.10) !important;
            box-shadow: 0 7px 22px rgba(255, 182, 217, 0.6) !important;
        }

        .game-nav-btn.primary {
            background: linear-gradient(135deg, #ff76b8, #ff1493) !important;
            color: white !important;
            border-color: #ff1493 !important;
        }

        .game-nav-btn.secondary {
            background: linear-gradient(135deg, #ffe8f0, #ffb6d9) !important;
            color: #ff69b4 !important;
        }

        .game-nav-btn.tertiary {
            background: linear-gradient(135deg, #fff9fc, #ffe8f0) !important;
            color: #ff69b4 !important;
        }
        .level-bar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 280px; background: linear-gradient(135deg, rgba(255,182,217,0.95), rgba(255,118,158,0.95)); border-radius: 15px; padding: 10px 14px; border: 3px solid #fff; box-shadow: 0 5px 20px rgba(255,105,180,0.5); z-index: 1000; }
        .level-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); margin-bottom: 4px; }
        .level-track { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
        .level-fill { height: 100%; background: linear-gradient(135deg, #fff, #ffe8f0); border-radius: 4px; transition: width 0.3s; }
        .level-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .level-card { padding: 10px; border-radius: 12px; background: linear-gradient(135deg, #fff9fc, #ffe8f0); border: 2px solid #ffb6d9; cursor: pointer; transition: all 0.2s; text-align: center; }
        .level-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,105,180,0.3); }
        .level-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
        .level-card.current { border-color: #ff69b4; background: linear-gradient(135deg, #ffe8f0, #ffb6d9); }
        .level-card-num { font-size: 18px; font-weight: bold; color: #ff69b4; }
        .level-card-target { font-size: 11px; color: #888; margin-top: 2px; }

        @media (min-width: 768px) {
            .controls { display: none; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label">分数</div>
                <div class="hud-value" id="score">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">距离</div>
                <div class="hud-value"><span id="distance">0</span>m</div>
            </div>
        </div>

        <div class="jump-indicator">
            跳跃: <span class="jump-dot active" id="jump1"></span><span class="jump-dot" id="jump2"></span>
        </div>
        <div class="level-bar" id="levelBar">
            <div class="level-info"><span id="levelName">第 1 关</span><span id="levelDist">0 / 300 m</span></div>
            <div class="level-track"><div class="level-fill" id="levelFill" style="width:0%"></div></div>
        </div>

        <canvas id="gameCanvas" width="900" height="450"></canvas>

        <div class="controls">
            <button class="control-btn" id="jumpBtn">⬆️</button>
        </div>

        <div class="game-over" id="gameOver">
            <h2 id="gameOverTitle">游戏结束!</h2>
            <p id="gameOverMsg">你跑了 <span id="finalScore">0</span> 米</p>
            <p>获得分数: <span id="finalPoints">0</span></p>
            <div id="gameOverButtons"><button class="btn" onclick="restartGame()">再来一局</button></div>
        </div>
    </div>

    <div class="game-nav">
        <button class="game-nav-btn primary" onclick="backToHall()">
            <span>🏠</span><span>返回大厅</span>
        </button>
        <button class="game-nav-btn secondary" onclick="openLevelSelect()">
            <span>🗺️</span><span>关卡</span>
        </button>
        <button class="game-nav-btn secondary" onclick="restartGame()">
            <span>🔄</span><span>重新开始</span>
        </button>
        <button class="game-nav-btn tertiary" onclick="alert('空格/↑ 跳跃（可二段跳）| 点击屏幕跳跃')">
            <span>❓</span><span>游戏说明</span>
        </button>
    </div>
    <div id="levelModal" class="game-over" style="z-index:3000;max-height:85vh;overflow-y:auto;">
        <div style="padding:30px;">
            <h2 style="color:#ff69b4;margin-bottom:15px;">🗺️ 关卡选择</h2>
            <div class="level-select-grid" id="levelGrid"></div>
            <div id="levelPagination" style="display:flex;justify-content:center;align-items:center;gap:15px;margin:15px 0;">
                <button class="btn" onclick="prevLevelPage()" style="padding:10px 20px;font-size:16px;">上一页</button>
                <span id="levelPageNum" style="font-size:16px;color:#ff69b4;font-weight:bold;">1 / 1</span>
                <button class="btn" onclick="nextLevelPage()" style="padding:10px 20px;font-size:16px;">下一页</button>
            </div>
            <button class="btn" onclick="closeLevelSelect()" style="margin-top:5px;">关闭</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = {
            x: 120,
            y: 310,
            width: 55,
            height: 90,
            vy: 0,
            onGround: true,
            jumps: 0,
            maxJumps: 2,
            legAngle: 0,
            armAngle: 0,
            hairOffset: 0,
            skirtOffset: 0
        };

        let obstacles = [];
        let coins = [];
        let score = 0;
        let distance = 0;
        let gameRunning = true;
        let gameSpeed = 6;
        let gravity = 0.7;
        let jumpForce = -15;
        let groundY = 380;

        const LEVELS = [
            { id: 1, name: '公园晨跑', target: 300, baseSpeed: 6, obsRate: 0.008 },
            { id: 2, name: '城市街道', target: 500, baseSpeed: 7, obsRate: 0.012 },
            { id: 3, name: '山间小径', target: 700, baseSpeed: 8, obsRate: 0.015 },
            { id: 4, name: '森林穿越', target: 900, baseSpeed: 9, obsRate: 0.018 },
            { id: 5, name: '沙漠疾驰', target: 1200, baseSpeed: 10, obsRate: 0.020 },
            { id: 6, name: '冰川奔跑', target: 1500, baseSpeed: 11, obsRate: 0.022 },
            { id: 7, name: '火山边缘', target: 2000, baseSpeed: 12, obsRate: 0.025 },
            { id: 8, name: '天空之城', target: 3000, baseSpeed: 13, obsRate: 0.028 }
        ];
        for (let i = 9; i <= 999; i++) {
            LEVELS.push({ id: i, name: `第${i}关`, target: 3000 + (i - 8) * 300, baseSpeed: Math.min(13 + (i - 8) * 0.3, 25), obsRate: Math.min(0.028 + (i - 8) * 0.002, 0.15) });
        }
        let levelPage = 0;
        const LEVELS_PER_PAGE = 30;
        let currentLevel = 1;

        function getGameData() {
            const defaults = { maxLevel: 1 };
            try { const raw = localStorage.getItem('runnerData_v2'); if (raw) return { ...defaults, ...JSON.parse(raw) }; } catch(e) {}
            return defaults;
        }
        function saveGameData(data) { localStorage.setItem('runnerData_v2', JSON.stringify(data)); }
        function getLevelConfig() { return LEVELS[Math.min(currentLevel, LEVELS.length) - 1] || LEVELS[0]; }
        function updateLevelUI() {
            const cfg = getLevelConfig();
            document.getElementById('levelName').textContent = `第 ${currentLevel} 关 · ${cfg.name}`;
            document.getElementById('levelDist').textContent = `${Math.floor(distance)} / ${cfg.target} m`;
            const pct = Math.min(100, Math.floor((distance / cfg.target) * 100));
            document.getElementById('levelFill').style.width = pct + '%';
        }

        function jump() {
            if (player.jumps < player.maxJumps && gameRunning) {
                player.vy = jumpForce;
                player.jumps++;
                player.onGround = false;
                updateJumpIndicator();

                if (player.jumps === 2) {
                    createJumpEffect();
                }
            }
        }

        function updateJumpIndicator() {
            document.getElementById('jump1').classList.toggle('active', player.jumps >= 1);
            document.getElementById('jump2').classList.toggle('active', player.jumps >= 2);
        }

        function createJumpEffect() {
            const effect = {
                x: player.x + player.width / 2,
                y: player.y + player.height,
                radius: 25,
                opacity: 1,
                stars: []
            };

            for (let i = 0; i < 8; i++) {
                effect.stars.push({
                    angle: (i * 45) * Math.PI / 180,
                    distance: 0
                });
            }

            const animateEffect = () => {
                if (effect.opacity <= 0) return;

                ctx.save();
                ctx.globalAlpha = effect.opacity;

                ctx.strokeStyle = '#ffb6d9';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ffeb3b';
                effect.stars.forEach(star => {
                    const starX = effect.x + Math.cos(star.angle) * (effect.radius * 0.7);
                    const starY = effect.y + Math.sin(star.angle) * (effect.radius * 0.7);
                    ctx.beginPath();
                    ctx.arc(starX, starY, 5, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();

                effect.radius += 6;
                effect.opacity -= 0.1;

                if (effect.opacity > 0) {
                    requestAnimationFrame(animateEffect);
                }
            };

            animateEffect();
        }

        function spawnObstacle() {
            const cfg = getLevelConfig();
            if (Math.random() < cfg.obsRate) {
                const type = Math.floor(Math.random() * 3);
                let obstacle = {
                    x: canvas.width + 50,
                    type: type
                };

                switch(type) {
                    case 0:
                        obstacle.y = groundY - 15 - 35;
                        obstacle.width = 35;
                        obstacle.height = 35;
                        break;
                    case 1:
                        obstacle.y = groundY - 15 - 60;
                        obstacle.width = 30;
                        obstacle.height = 60;
                        break;
                    case 2:
                        obstacle.y = groundY - 15 - 40;
                        obstacle.width = 50;
                        obstacle.height = 40;
                        break;
                }

                obstacles.push(obstacle);
            }
        }

        function spawnCoin() {
            if (Math.random() < 0.025) {
                coins.push({
                    x: canvas.width,
                    y: groundY - 15 - 85 - Math.random() * 65,
                    radius: 20,
                    rotation: 0,
                    sparkle: Math.random() * Math.PI * 2
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.height - 15) {
                player.y = groundY - player.height - 15;
                player.vy = 0;
                player.onGround = true;
                player.jumps = 0;
                updateJumpIndicator();
            }

            if (player.onGround) {
                player.legAngle += 0.20;
                player.armAngle += 0.20;
                player.hairOffset = Math.sin(player.legAngle) * 2;
                player.skirtOffset = Math.sin(player.legAngle * 2) * 1.5;
            } else {
                player.legAngle = 0;
                player.armAngle = 0;
                player.hairOffset = 0;
                player.skirtOffset = 0;
            }

            spawnObstacle();
            spawnCoin();

            obstacles.forEach((obs, index) => {
                obs.x -= gameSpeed;

                const hitboxPadding = 10;
                if (player.x + hitboxPadding < obs.x + obs.width - hitboxPadding &&
                    player.x + player.width - hitboxPadding > obs.x + hitboxPadding &&
                    player.y + hitboxPadding < obs.y + obs.height - hitboxPadding &&
                    player.y + player.height - hitboxPadding > obs.y + hitboxPadding) {
                    gameOver();
                }

                if (obs.x < -60) {
                    obstacles.splice(index, 1);
                }
            });

            coins.forEach((coin, index) => {
                coin.x -= gameSpeed;
                coin.rotation += 0.12;
                coin.sparkle += 0.18;

                const dx = player.x + player.width/2 - coin.x;
                const dy = player.y + player.height/2 - coin.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.width/2 + coin.radius) {
                    score += 10;
                    document.getElementById('score').textContent = score;
                    coins.splice(index, 1);
                }

                if (coin.x < -40) {
                    coins.splice(index, 1);
                }
            });

            distance += gameSpeed / 60;
            document.getElementById('distance').textContent = Math.floor(distance);
            const cfg = getLevelConfig();
            gameSpeed = Math.min(cfg.baseSpeed + 4, cfg.baseSpeed + distance / 150);
            updateLevelUI();
            if (distance >= cfg.target) {
                levelComplete();
                return;
            }
        }

        // 绘制漂亮的3D漫画JK女生（长发到腰，有脖子）
        function drawBeautifulJkGirl(x, y, width, height) {
            ctx.save();

            // 角色阴影
            const shadowGradient = ctx.createRadialGradient(
                x + width/2, y + height + 15, 0,
                x + width/2, y + height + 15, width/2 + 10
            );
            shadowGradient.addColorStop(0, 'rgba(255, 182, 217, 0.5)');
            shadowGradient.addColorStop(1, 'rgba(255, 182, 217, 0)');
            ctx.fillStyle = shadowGradient;
            ctx.beginPath();
            ctx.ellipse(x + width/2, y + height + 15, width/2 + 10, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // === 黑长直（自然飘动） ===
            const hairLength = 85;
            const hairWave = Math.sin(Date.now() / 300) * 2;

            // 左侧主长发
            const leftHairGradient = ctx.createLinearGradient(x - 10, y, x - 25, y + hairLength);
            leftHairGradient.addColorStop(0, '#3d3d3d');
            leftHairGradient.addColorStop(0.5, '#2d2d2d');
            leftHairGradient.addColorStop(1, '#1a1a1a');
            ctx.fillStyle = leftHairGradient;
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 25);
            ctx.quadraticCurveTo(x - 12 + hairWave, y + 50, x - 10, y + hairLength - 5);
            ctx.quadraticCurveTo(x - 5, y + hairLength + 8, x + 8, y + height - 5);
            ctx.fill();

            // 左侧自然发丝（增加一点不规则感）
            ctx.fillStyle = 'rgba(45, 45, 45, 0.7)';
            ctx.beginPath();
            ctx.moveTo(x + 2, y + 28);
            ctx.quadraticCurveTo(x - 18 + hairWave * 0.5, y + 52, x - 14, y + hairLength - 10);
            ctx.quadraticCurveTo(x - 6, y + hairLength + 3, x + 6, y + height - 8);
            ctx.fill();

            // 右侧主长发
            const rightHairGradient = ctx.createLinearGradient(x + width + 10, y, x + width + 25, y + hairLength);
            rightHairGradient.addColorStop(0, '#3d3d3d');
            rightHairGradient.addColorStop(0.5, '#2d2d2d');
            rightHairGradient.addColorStop(1, '#1a1a1a');
            ctx.fillStyle = rightHairGradient;
            ctx.beginPath();
            ctx.moveTo(x + width - 5, y + 25);
            ctx.quadraticCurveTo(x + width + 12 + hairWave, y + 50, x + width + 10, y + hairLength - 5);
            ctx.quadraticCurveTo(x + width + 5, y + hairLength + 8, x + width - 8, y + height - 5);
            ctx.fill();

            // 右侧自然发丝
            ctx.fillStyle = 'rgba(45, 45, 45, 0.7)';
            ctx.beginPath();
            ctx.moveTo(x + width - 2, y + 28);
            ctx.quadraticCurveTo(x + width + 18 + hairWave * 0.5, y + 52, x + width + 14, y + hairLength - 10);
            ctx.quadraticCurveTo(x + width + 6, y + hairLength + 3, x + width - 6, y + height - 8);
            ctx.fill();

            // === 腿部 ===
            const legWidth = 14;
            const legLength = 45;
            const legOffset = Math.sin(player.legAngle) * 8;

            // 白色长袜（左腿）
            const leftSockGradient = ctx.createLinearGradient(x + 10, y + height, x + 24, y + height);
            leftSockGradient.addColorStop(0, '#fff');
            leftSockGradient.addColorStop(0.5, '#fef5f8');
            leftSockGradient.addColorStop(1, '#fce4ec');

            ctx.fillStyle = leftSockGradient;
            ctx.beginPath();
            ctx.roundRect(x + 12, y + height - 8, legWidth, legLength + legOffset, 7);
            ctx.fill();

            ctx.fillStyle = '#ffb6d9';
            ctx.beginPath();
            ctx.roundRect(x + 12, y + height + legLength + legOffset - 8, legWidth, 8, 7);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.roundRect(x + 14, y + height - 5, 3, legLength + legOffset - 12, 2);
            ctx.fill();

            // 白色长袜（右腿）
            const rightSockGradient = ctx.createLinearGradient(x + width - 24, y + height, x + width - 10, y + height);
            rightSockGradient.addColorStop(0, '#fce4ec');
            rightSockGradient.addColorStop(0.5, '#fef5f8');
            rightSockGradient.addColorStop(1, '#fff');

            ctx.fillStyle = rightSockGradient;
            ctx.beginPath();

                const mouthGradient = ctx.createLinearGradient(
                    headX + headSize/2 - 6, headY + headSize/2 + 18,
                    headX + headSize/2 + 6, headY + headSize/2 + 18
                );
                mouthGradient.addColorStop(0, '#ff9eb8');
                mouthGradient.addColorStop(0.5, '#ffb6d9');
                mouthGradient.addColorStop(1, '#ff9eb8');

                ctx.strokeStyle = mouthGradient;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(headX + headSize/2, headY + headSize/2 + 16, 6, 0.2, Math.PI - 0.2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(headX + headSize/2 + 2, headY + headSize/2 + 14, 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                const mouthGradient = ctx.createRadialGradient(
                    headX + headSize/2, headY + headSize/2 + 16, 1,
                    headX + headSize/2, headY + headSize/2 + 16, 4
                );
                mouthGradient.addColorStop(0, '#ffb6d9');
                mouthGradient.addColorStop(1, '#ff9eb8');

                ctx.fillStyle = mouthGradient;
                ctx.beginPath();
                ctx.ellipse(headX + headSize/2, headY + headSize/2 + 16, 3, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // === 精致发饰 ===
            const bowX = headX + headSize + 4;
            const bowY = headY + 4;

            const leftBowGradient = ctx.createRadialGradient(
                bowX - 7, bowY, 1,
                bowX - 7, bowY, 10
            );
            leftBowGradient.addColorStop(0, '#ffd9eb');
            leftBowGradient.addColorStop(0.5, '#ffb6d9');
            leftBowGradient.addColorStop(1, '#ff9eb8');

            ctx.fillStyle = leftBowGradient;
            ctx.beginPath();
            ctx.ellipse(bowX - 7, bowY, 10, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();

            const rightBowGradient = ctx.createRadialGradient(
                bowX + 7, bowY, 1,
                bowX + 7, bowY, 10
            );
            rightBowGradient.addColorStop(0, '#ffd9eb');
            rightBowGradient.addColorStop(0.5, '#ffb6d9');
            rightBowGradient.addColorStop(1, '#ff9eb8');

            ctx.fillStyle = rightBowGradient;
            ctx.beginPath();
            ctx.ellipse(bowX + 7, bowY, 10, 6, 0.3, 0, Math.PI * 2);
            ctx.fill();

            const bowCenterGradient = ctx.createRadialGradient(
                bowX, bowY, 1,
                bowX, bowY, 5
            );
            bowCenterGradient.addColorStop(0, '#ffcce0');
            bowCenterGradient.addColorStop(1, '#ff9eb8');

            ctx.fillStyle = bowCenterGradient;
            ctx.beginPath();
            ctx.arc(bowX, bowY, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(bowX - 2, bowY - 2, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(bowX + 2, bowY - 1, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 可爱背景云朵
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            const time = Date.now() / 80;
            const cloudPositions = [
                { x: (time) % 1000 - 80, y: 40, size: 50 },
                { x: ((time + 250) % 1000) - 80, y: 70, size: 42 },
                { x: ((time + 500) % 1000) - 80, y: 35, size: 48 },
                { x: ((time + 750) % 1000) - 80, y: 65, size: 45 }
            ];

            cloudPositions.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.75, cloud.y - cloud.size * 0.12, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.4, cloud.y, cloud.size * 0.85, 0, Math.PI * 2);
                ctx.fill();
            });

            // 地面
            const groundGradient = ctx.createLinearGradient(0, groundY - 15, 0, canvas.height);
            groundGradient.addColorStop(0, '#ffd9eb');
            groundGradient.addColorStop(0.5, '#ffb6d9');
            groundGradient.addColorStop(1, '#ff9eb8');

            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, groundY - 15, canvas.width, canvas.height - groundY + 15);

            const grassGradient = ctx.createLinearGradient(0, groundY - 15, 0, groundY + 10);
            grassGradient.addColorStop(0, '#90EE90');
            grassGradient.addColorStop(1, '#7CCD7C');

            ctx.fillStyle = grassGradient;
            ctx.fillRect(0, groundY - 15, canvas.width, 25);

            // 小花装饰
            for (let i = 0; i < 12; i++) {
                const flowerX = ((i * 100 + time * 0.5) % 1000);
                const flowerY = groundY - 10 + Math.sin(i) * 8;
                ctx.fillStyle = ['#ffb6d9', '#ffcce0', '#ffd9eb', '#fff'][i % 4];
                ctx.beginPath();
                ctx.arc(flowerX, flowerY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(flowerX, flowerY, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // 绘制JK女生
            drawBeautifulJkGirl(player.x, player.y, player.width, player.height);

            // 障碍物
            obstacles.forEach(obs => {
                const obsGradient = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.width, obs.y);
                obsGradient.addColorStop(0, '#ffd9eb');
                obsGradient.addColorStop(0.5, '#ffb6d9');
                obsGradient.addColorStop(1, '#ff9eb8');

                ctx.fillStyle = obsGradient;
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 10);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                const heartX = obs.x + obs.width/2;
                const heartY = obs.y + obs.height/2;
                ctx.beginPath();
                ctx.moveTo(heartX, heartY + 3);
                ctx.bezierCurveTo(heartX, heartY, heartX - 5, heartY - 3, heartX - 5, heartY);
                ctx.bezierCurveTo(heartX - 5, heartY + 3, heartX, heartY + 5, heartX, heartY + 6);
                ctx.bezierCurveTo(heartX, heartY + 5, heartX + 5, heartY + 3, heartX + 5, heartY);
                ctx.bezierCurveTo(heartX + 5, heartY - 3, heartX, heartY, heartX, heartY + 3);
                ctx.fill();
            });

            // 金币
            coins.forEach(coin => {
                ctx.save();
                ctx.translate(coin.x, coin.y);

                ctx.fillStyle = 'rgba(255, 105, 180, 0.35)';
                ctx.beginPath();
                ctx.ellipse(0, coin.radius + 10, coin.radius, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                const scale = Math.abs(Math.cos(coin.rotation));
                ctx.scale(scale, 1);

                const starGradient = ctx.createRadialGradient(0, 0, 3, 0, 0, coin.radius);
                starGradient.addColorStop(0, '#fffef0');
                starGradient.addColorStop(0.3, '#ffeb3b');
                starGradient.addColorStop(0.7, '#ffc107');
                starGradient.addColorStop(1, '#ffb6d9');

                ctx.fillStyle = starGradient;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 72 - 90) * Math.PI / 180;
                    const x = Math.cos(angle) * coin.radius;
                    const y = Math.sin(angle) * coin.radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    const innerAngle = ((i * 72) + 36 - 90) * Math.PI / 180;
                    const innerX = Math.cos(innerAngle) * (coin.radius * 0.35);
                    const innerY = Math.sin(innerAngle) * (coin.radius * 0.35);
                    ctx.lineTo(innerX, innerY);
                }
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(-4, -4, 5, 0, Math.PI * 2);
                ctx.fill();

                const sparkleAngle = coin.sparkle;
                const sparkleDist = coin.radius * 0.6;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                for (let i = 0; i < 4; i++) {
                    const angle = sparkleAngle + (i * Math.PI / 2);
                    const sx = Math.cos(angle) * sparkleDist;
                    const sy = Math.sin(angle) * sparkleDist;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function levelComplete() {
            gameRunning = false;
            const cfg = getLevelConfig();
            const data = getGameData();
            const levelBonus = currentLevel * 50;
            if (currentLevel >= data.maxLevel && currentLevel < LEVELS.length) data.maxLevel = currentLevel + 1;
            saveGameData(data);
            document.getElementById('gameOverTitle').textContent = '🎉 关卡完成!';
            document.getElementById('gameOverTitle').style.color = '#ff69b4';
            document.getElementById('gameOverMsg').innerHTML = `完成 ${cfg.name} · ${Math.floor(distance)} 米`;
            document.getElementById('finalPoints').textContent = score + ' + ' + levelBonus + ' 奖励';
            const btns = document.getElementById('gameOverButtons');
            if (currentLevel < LEVELS.length) {
                btns.innerHTML = `<button class="btn" onclick="nextLevel()">下一关</button><button class="btn" onclick="restartGame()">重玩本关</button>`;
            } else {
                btns.innerHTML = `<button class="btn" onclick="restartGame()">再次挑战</button>`;
            }
            document.getElementById('gameOver').classList.add('show');
        }
        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOverTitle').textContent = '游戏结束!';
            document.getElementById('gameOverTitle').style.color = '';
            document.getElementById('gameOverMsg').innerHTML = `你跑了 <span id="finalScore">${Math.floor(distance)}</span> 米`;
            document.getElementById('finalPoints').textContent = score;
            document.getElementById('gameOverButtons').innerHTML = `<button class="btn" onclick="restartGame()">再来一局</button>`;
            document.getElementById('gameOver').classList.add('show');
        }
        function nextLevel() {
            if (currentLevel < LEVELS.length) currentLevel++;
            restartGame();
        }
        function openLevelSelect() { levelPage = Math.floor((currentLevel - 1) / LEVELS_PER_PAGE); document.getElementById('levelModal').classList.add('show'); renderLevelSelect(); }
        function closeLevelSelect() { document.getElementById('levelModal').classList.remove('show'); }
        function prevLevelPage() { if (levelPage > 0) { levelPage--; renderLevelSelect(); } }
        function nextLevelPage() { const maxPage = Math.ceil(LEVELS.length / LEVELS_PER_PAGE) - 1; if (levelPage < maxPage) { levelPage++; renderLevelSelect(); } }
        function renderLevelSelect() {
            const data = getGameData();
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            const start = levelPage * LEVELS_PER_PAGE;
            const end = Math.min(start + LEVELS_PER_PAGE, LEVELS.length);
            for (let i = start; i < end; i++) {
                const lv = LEVELS[i];
                const unlocked = lv.id <= data.maxLevel;
                const isCurrent = lv.id === currentLevel;
                const card = document.createElement('div');
                card.className = 'level-card' + (isCurrent ? ' current' : '') + (!unlocked ? ' locked' : '');
                card.innerHTML = `<div class="level-card-num">${lv.id}</div><div class="level-card-target">${lv.name}</div><div class="level-card-target">目标 ${lv.target}m</div>`;
                if (unlocked) card.onclick = () => { currentLevel = lv.id; closeLevelSelect(); restartGame(); };
                grid.appendChild(card);
            }
            const maxPage = Math.ceil(LEVELS.length / LEVELS_PER_PAGE);
            document.getElementById('levelPageNum').textContent = `${levelPage + 1} / ${maxPage}`;
        }

        function restartGame() {
            player = {
                x: 120,
                y: 310,
                width: 55,
                height: 90,
                vy: 0,
                onGround: true,
                jumps: 0,
                maxJumps: 2,
                legAngle: 0,
                armAngle: 0,
                hairOffset: 0,
                skirtOffset: 0
            };
            obstacles = [];
            coins = [];
            score = 0;
            distance = 0;
            gameRunning = true;
            const cfg = getLevelConfig();
            gameSpeed = cfg.baseSpeed;
            document.getElementById('score').textContent = '0';
            document.getElementById('distance').textContent = '0';
            document.getElementById('gameOver').classList.remove('show');
            updateJumpIndicator();
            updateLevelUI();
            gameLoop();
        }

        function backToHall() {
            window.location.href = '../index.html';
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });

        document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            if (e.target.id !== 'jumpBtn') {
                e.preventDefault();
                jump();
            }
        });

        updateJumpIndicator();
        gameLoop();
    </script>
</body>
</html>
