<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终修复工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .section h2 { color: #667eea; margin-bottom: 15px; }
        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .game-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #dee2e6;
        }
        .game-item.fixed {
            border-color: #28a745;
            background: #d4edda;
        }
        .game-item a {
            display: inline-block;
            padding: 5px 10px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover { transform: translateY(-2px); }
        button.danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏问题最终修复工具</h1>

        <div class="section">
            <h2>步骤 1：清除重复数据</h2>
            <p>如果主页显示重复游戏，请点击下面的按钮清除localStorage数据：</p>
            <button onclick="clearDuplicateGames()">🗑️ 清除重复游戏数据</button>
            <button onclick="forceClear()" class="danger">⚠️ 强制清除所有缓存</button>
        </div>

        <div id="status" class="status"></div>

        <div class="section">
            <h2>步骤 2：测试所有游戏</h2>
            <p>点击下面的链接测试每个游戏是否能正常运行：</p>
            <div class="game-list">
                <div class="game-item fixed">
                    <strong>🐍 贪吃蛇</strong><br>
                    <small>完整游戏</small><br>
                    <a href="snake-game/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🔢 2048</strong><br>
                    <small>已修复</small><br>
                    <a href="2048/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🟦 俄罗斯方块</strong><br>
                    <small>已修复</small><br>
                    <a href="tetris/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🧱 打砖块</strong><br>
                    <small>已修复</small><br>
                    <a href="breakout/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🏃 跑酷</strong><br>
                    <small>已添加逻辑</small><br>
                    <a href="runner-game/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🎮 坦克</strong><br>
                    <small>已添加逻辑</small><br>
                    <a href="tank-battle/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🏰 塔防</strong><br>
                    <small>已添加逻辑</small><br>
                    <a href="tower-defense/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🔨 打地鼠</strong><br>
                    <small>已修复</small><br>
                    <a href="whack-a-mole/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🃏 记忆</strong><br>
                    <small>已修复</small><br>
                    <a href="memory/index.html" target="_blank">测试</a>
                </div>
                <div class="game-item fixed">
                    <strong>🏓 弹球</strong><br>
                    <small>已修复</small><br>
                    <a href="pong-game/index.html" target="_blank">测试</a>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>步骤 3：返回主页</h2>
            <button onclick="goHome()">🏠 返回主页测试</button>
        </div>
    </div>

    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = message;
        }

        function clearDuplicateGames() {
            try {
                const customGames = localStorage.getItem('customGames');
                let count = 0;

                if (customGames) {
                    count = JSON.parse(customGames).length;
                    localStorage.removeItem('customGames');
                }

                localStorage.removeItem('favoriteGames');

                showStatus(
                    `✅ 成功清除了 ${count} 个重复游戏！<br>现在应该只显示15个系统游戏。<br><br>请点击"返回主页测试"按钮。`,
                    'success'
                );
            } catch (error) {
                showStatus('❌ 清除失败：' + error.message, 'error');
            }
        }

        function forceClear() {
            if (confirm('确定要清除所有缓存吗？这将删除所有游戏进度和设置！')) {
                const userData = localStorage.getItem('userData');
                const playerData = localStorage.getItem('playerData');

                localStorage.clear();

                if (userData) localStorage.setItem('userData', userData);
                if (playerData) localStorage.setItem('playerData', playerData);

                showStatus(
                    '✅ 已清除所有缓存！<br>游戏将恢复到初始状态。',
                    'success'
                );
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // 页面加载时自动检查
        window.addEventListener('DOMContentLoaded', () => {
            const customGames = localStorage.getItem('customGames');

            if (customGames) {
                try {
                    const games = JSON.parse(customGames);
                    if (games.length > 0) {
                        showStatus(
                            `⚠️ 检测到 ${games.length} 个自定义游戏！<br>这可能导致主页显示重复游戏。<br><br>请点击"清除重复游戏数据"按钮。`,
                            'error'
                        );
                    }
                } catch (e) {
                    showStatus('❌ 数据损坏，请清除缓存', 'error');
                }
            } else {
                showStatus(
                    '✅ 数据正常！<br>所有游戏已修复完成。<br><br>请测试上面的游戏链接，确认它们能正常运行。',
                    'success'
                );
            }
        });
    </script>
</body>
</html>
