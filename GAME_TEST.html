<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏最终测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }

        .step {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .step h2 { color: #667eea; margin-bottom: 15px; }

        .big-button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        .big-button:hover { transform: translateY(-2px); }
        .big-button.danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .game-card {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .game-card .icon { font-size: 32px; }
        .game-card .name { font-weight: bold; margin: 10px 0; }
        .game-card .status { font-size: 12px; color: #666; }
        .game-card.working { border-color: #28a745; background: #d4edda; }
        .game-card.broken { border-color: #dc3545; background: #f8d7da; }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .message.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏最终测试和修复</h1>

        <div class="step">
            <h2>第一步：强制清除所有缓存</h2>
            <p>很多游戏问题是由localStorage缓存导致的，请先清除缓存。</p>
            <button class="big-button danger" onclick="clearAllCache()">
                ⚠️ 强制清除所有缓存
            </button>
            <div id="cacheMessage" class="message"></div>
        </div>

        <div class="step">
            <h2>第二步：测试所有游戏</h2>
            <p>点击下面的游戏卡片进行测试，然后告诉我结果：</p>

            <div class="game-grid">
                <div class="game-card" onclick="testGame('snake-game', this)">
                    <div class="icon">🐍</div>
                    <div class="name">贪吃蛇</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('2048', this)">
                    <div class="icon">🔢</div>
                    <div class="name">2048</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('tetris', this)">
                    <div class="icon">🟦</div>
                    <div class="name">俄罗斯方块</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('breakout', this)">
                    <div class="icon">🧱</div>
                    <div class="name">打砖块</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('runner-game', this)">
                    <div class="icon">🏃</div>
                    <div class="name">跑酷</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('tank-battle', this)">
                    <div class="icon">🎮</div>
                    <div class="name">坦克</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('tower-defense', this)">
                    <div class="icon">🏰</div>
                    <div class="name">塔防</div>
                    <div class="status">点击测试</div>
                </div>
                <div class="game-card" onclick="testGame('memory', this)">
                    <div class="icon">🃏</div>
                    <div class="name">记忆</div>
                    <div class="status">点击测试</div>
                </div>
            </div>

            <div id="testMessage" class="message"></div>
        </div>

        <div class="step">
            <h2>第三步：返回主页</h2>
            <button class="big-button" onclick="goHome()">
                🏠 返回主页
            </button>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const msgDiv = document.getElementById('testMessage');
            msgDiv.className = 'message ' + type + ' show';
            msgDiv.innerHTML = text;
        }

        function clearAllCache() {
            const msgDiv = document.getElementById('cacheMessage');

            try {
                // 清除所有localStorage
                localStorage.clear();

                msgDiv.className = 'message success show';
                msgDiv.innerHTML = '✅ 已清除所有缓存！<br>页面将在3秒后自动刷新...';

                // 3秒后刷新页面
                setTimeout(() => {
                    location.reload();
                }, 3000);

            } catch (error) {
                msgDiv.className = 'message error show';
                msgDiv.innerHTML = '❌ 清除失败：' + error.message;
            }
        }

        function testGame(gamePath, card) {
            // 标记为正在测试
            card.querySelector('.status').textContent = '测试中...';

            // 在新窗口中打开游戏
            const gameWindow = window.open(gamePath + '/index.html', '_blank',
                'width=800,height=600,scrollbars=yes,resizable=yes');

            if (gameWindow) {
                showMessage('✅ 已在新窗口中打开游戏，请测试游戏是否能正常运行。', 'info');
                card.querySelector('.status').textContent = '已打开';
            } else {
                showMessage('❌ 无法打开新窗口，请检查浏览器弹窗设置。', 'error');
                card.querySelector('.status').textContent = '打开失败';
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // 页面加载时检查缓存
        window.addEventListener('DOMContentLoaded', () => {
            const keys = Object.keys(localStorage);
            if (keys.length > 0) {
                document.getElementById('cacheMessage').className = 'message error show';
                document.getElementById('cacheMessage').innerHTML =
                    '⚠️ 检测到缓存数据，建议先清除！';
            }
        });
    </script>
</body>
</html>
