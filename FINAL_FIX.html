<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终修复工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover { transform: translateY(-2px); }
        button.danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .checklist {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        .checklist li {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 5px;
            display: flex;
            align-items: center;
        }
        .checklist li:before {
            content: '✓';
            color: #00b894;
            font-weight: bold;
            margin-right: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏问题最终修复</h1>

        <div id="status" class="status"></div>

        <div class="info" style="display: block;">
            <h3>已修复的问题：</h3>
            <ul class="checklist">
                <li>修复了9个游戏的JavaScript语法错误</li>
                <li>修复了backToHall函数问题</li>
                <li>添加了返回大厅功能</li>
            </ul>
        </div>

        <button onclick="clearDuplicateGames()">
            🗑️ 清除重复游戏数据
        </button>

        <button onclick="forceClear()" class="danger">
            ⚠️ 强制清除所有缓存
        </button>

        <button onclick="testGames()">
            🧪 测试游戏链接
        </button>

        <button onclick="goHome()">
            🏠 返回主页测试
        </button>

        <div id="testResults" style="margin-top: 20px;"></div>
    </div>

    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = message;
        }

        function clearDuplicateGames() {
            try {
                const customGames = localStorage.getItem('customGames');
                let count = 0;

                if (customGames) {
                    count = JSON.parse(customGames).length;
                    localStorage.removeItem('customGames');
                }

                // 同时清除其他可能导致重复的数据
                localStorage.removeItem('favoriteGames');

                showStatus(
                    `✅ 成功清除了 ${count} 个重复游戏！<br>现在应该只显示15个系统游戏。`,
                    'success'
                );
            } catch (error) {
                showStatus('❌ 清除失败：' + error.message, 'error');
            }
        }

        function forceClear() {
            if (confirm('确定要清除所有缓存吗？这将删除所有游戏进度和设置！')) {
                // 保存用户基本数据
                const userData = localStorage.getItem('userData');
                const playerData = localStorage.getItem('playerData');

                localStorage.clear();

                // 恢复基本数据
                if (userData) localStorage.setItem('userData', userData);
                if (playerData) localStorage.setItem('playerData', playerData);

                showStatus(
                    '✅ 已清除所有缓存！<br>游戏将恢复到初始状态。',
                    'success'
                );
            }
        }

        function testGames() {
            const games = [
                { id: 'snake', name: '贪吃蛇', url: 'snake-game/index.html' },
                { id: '2048', name: '2048', url: '2048/index.html' },
                { id: 'runner', name: '跑酷大冒险', url: 'runner-game/index.html' }
            ];

            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<h3>游戏测试结果：</h3>';

            let results = '';

            games.forEach(game => {
                results += `
                    <div style="padding: 10px; margin: 5px 0; background: #f8f9fa; border-radius: 5px;">
                        <strong>${game.name}</strong>
                        <a href="${game.url}" target="_blank" style="margin-left: 10px; padding: 5px 10px; background: #667eea; color: white; text-decoration: none; border-radius: 5px;">测试</a>
                    </div>
                `;
            });

            resultsDiv.innerHTML += results;
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // 页面加载时自动检查
        window.addEventListener('DOMContentLoaded', () => {
            const customGames = localStorage.getItem('customGames');

            if (customGames) {
                try {
                    const games = JSON.parse(customGames);
                    if (games.length > 0) {
                        showStatus(
                            `⚠️ 检测到 ${games.length} 个自定义游戏，可能导致重复显示！<br><br>请点击"清除重复游戏数据"按钮。`,
                            'error'
                        );
                    }
                } catch (e) {
                    showStatus('❌ 数据损坏，请清除缓存', 'error');
                }
            } else {
                showStatus(
                    '✅ 数据正常，没有发现重复游戏！<br>可以直接返回主页测试。',
                    'success'
                );
            }
        });
    </script>
</body>
</html>
