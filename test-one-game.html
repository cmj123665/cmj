<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .test-item {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .test-item a {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        .test-item a:hover {
            background: #0056b3;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        h1 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏测试页面</h1>
        <p style="text-align: center;">点击下面的链接测试每个游戏</p>

        <div id="gameList"></div>
    </div>

    <script>
        const games = [
            { id: 'snake', name: '🐍 贪吃蛇大作战', url: 'snake-game/index.html' },
            { id: '2048', name: '🔢 2048进化版', url: '2048/index.html' },
            { id: 'runner', name: '🏃 跑酷大冒险', url: 'runner-game/index.html' },
            { id: 'shooter', name: '🚀 太空射击', url: 'space-shooter/index.html' },
            { id: 'pong', name: '🏓 弹球挑战', url: 'pong-game/index.html' },
            { id: 'breakout', name: '🧱 打砖块', url: 'breakout/index.html' },
            { id: 'tile', name: '🍎 消消大作战', url: 'tile-game/index.html' },
            { id: 'memory', name: '🃏 记忆翻牌', url: 'memory/index.html' },
            { id: 'minesweeper', name: '💣 扫雷', url: 'minesweeper/index.html' },
            { id: 'gomoku', name: '⚫ 五子棋', url: 'gomoku/index.html' },
            { id: 'tetris', name: '🟦 俄罗斯方块', url: 'tetris/index.html' },
            { id: 'whack', name: '🔨 打地鼠', url: 'whack-a-mole/index.html' },
            { id: 'tank', name: '🎮 坦克大战', url: 'tank-battle/index.html' },
            { id: 'puzzle', name: '🧩 拼图游戏', url: 'puzzle/index.html' },
            { id: 'tower', name: '🏰 塔防大战', url: 'tower-defense/index.html' }
        ];

        const container = document.getElementById('gameList');

        games.forEach(game => {
            const div = document.createElement('div');
            div.className = 'test-item';
            div.innerHTML = `
                <strong>${game.name}</strong>
                <a href="${game.url}" target="_blank">测试游戏</a>
                <a href="${game.url}" target="gameFrame">在iframe中测试</a>
            `;
            container.appendChild(div);
        });

        // 检查localStorage
        const customGames = JSON.parse(localStorage.getItem('customGames')) || [];
        const statusDiv = document.createElement('div');
        statusDiv.className = 'status ' + (customGames.length > 0 ? 'error' : 'success');
        statusDiv.textContent = `检测到 ${customGames.length} 个自定义游戏`;
        document.querySelector('.container').insertBefore(
            statusDiv,
            document.getElementById('gameList')
        );
    </script>
</body>
</html>
